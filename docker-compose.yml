services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      TOGOCYBER_DB_PATH: /app/database/togocyber.sqlite3
      TOGOCYBER_MODELS_DIR: /app/models/artifacts
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-0}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8501}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_FROM: ${SMTP_FROM:-${NOTIFICATION_SMTP_FROM:-}}
      ZEEK_LOG_PATH: ${ZEEK_LOG_PATH:-}
      SURICATA_EVE_PATH: ${SURICATA_EVE_PATH:-}
      SYSLOG_HOST: ${SYSLOG_HOST:-}
      SYSLOG_PORT: ${SYSLOG_PORT:-}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      SIEM_API_URL: ${SIEM_API_URL:-}
      SIEM_API_TOKEN: ${SIEM_API_TOKEN:-}
      NOTIFICATION_SMTP_HOST: ${NOTIFICATION_SMTP_HOST:-}
      NOTIFICATION_SMTP_PORT: ${NOTIFICATION_SMTP_PORT:-587}
      NOTIFICATION_SMTP_USERNAME: ${NOTIFICATION_SMTP_USERNAME:-}
      NOTIFICATION_SMTP_PASSWORD: ${NOTIFICATION_SMTP_PASSWORD:-}
      NOTIFICATION_SMTP_FROM: ${NOTIFICATION_SMTP_FROM:-}
      NOTIFICATION_SMTP_TO: ${NOTIFICATION_SMTP_TO:-}
      NOTIFICATION_SLACK_WEBHOOK: ${NOTIFICATION_SLACK_WEBHOOK:-}
      NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - togocyber-data:/app/database
      - ./models/artifacts:/app/models/artifacts:ro
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["streamlit", "run", "frontend/app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      TOGOCYBER_API_URL: http://api:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  togocyber-data: