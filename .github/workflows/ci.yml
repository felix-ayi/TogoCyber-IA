name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "ruff>=0.6,<1"
      # Gate on real defects (syntax + pyflakes); see pyproject.toml [tool.ruff.lint].
      - run: ruff check .

  test:
    name: Tests (pytest)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      # Trained .joblib artifacts are intentionally not committed; the test suite
      # mocks model loading, so it runs green on a fresh checkout.
      - run: pytest -q

  security:
    name: Security checks
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      # SAST on our own code — blocking. Justified false positives carry `# nosec`.
      - name: Bandit (backend, ml)
        run: bandit -q -r backend ml -x '*/__pycache__/*'
      # Dependency CVE scan of the resolved environment — informational.
      # requirements.txt is unpinned, so a transitive advisory should not by
      # itself block unrelated work; review the report and pin/upgrade
      # deliberately. See docs/contributing.md.
      - name: pip-audit (advisory, non-blocking)
        continue-on-error: true
        run: pip-audit

  docker:
    name: Docker build
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t togocyber-api:ci .
      # No push, no production deploy: image build is verification only.
